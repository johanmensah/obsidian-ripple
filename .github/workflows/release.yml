name: Release plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const read = (path) => JSON.parse(readFileSync(path, "utf8"));
            const manifest = read("manifest.json");
            const pkg = read("package.json");
            const versions = read("versions.json");
            const tag = process.env.RELEASE_TAG;
            if (tag !== manifest.version) throw new Error(`Tag ${tag} does not match manifest ${manifest.version}`);
            if (pkg.version !== manifest.version) throw new Error("Package and manifest versions differ");
            if (versions[manifest.version] !== manifest.minAppVersion) throw new Error("versions.json does not match the manifest");
          '

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run build

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --draft \
            --generate-notes \
            main.js manifest.json styles.css
